<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Abu Dhabi Guide | Guia Abu Dhabi</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --primary: #0f172a;
      --accent: #d97706;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding-bottom: 50px; }

    /* Header Styling */
    header {
      background: linear-gradient(135deg, #0b1329 0%, #1e293b 100%);
      color: white;
      padding: 3.5rem 1.5rem 4rem 1.5rem;
      text-align: center;
      position: relative;
    }

    header h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem; letter-spacing: -0.025em; }
    header p { opacity: 0.8; font-size: 1.1rem; font-weight: 400; max-width: 600px; margin: 0 auto; }

    .lang-switcher {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .lang-switcher:hover { background: rgba(255, 255, 255, 0.3); transform: translateY(-1px); }

    /* Search & Filters */
    .controls-container {
      max-width: 1250px;
      margin: -2rem auto 2rem auto;
      padding: 0 1.5rem;
    }

    .search-box {
      width: 100%;
      padding: 1.1rem 1.5rem;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-md);
      outline: none;
      background: white;
      margin-bottom: 1.25rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box:focus { border-color: var(--accent); box-shadow: var(--shadow-lg); }

    .filter-tags {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tag-btn {
      background: white;
      border: 1px solid var(--border);
      padding: 0.6rem 1.2rem;
      border-radius: 30px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text-muted);
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }

    .tag-btn:hover, .tag-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    /* Main Container Layout */
    .main-layout {
      max-width: 1250px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      padding: 0 1.5rem;
    }

    @media (min-width: 950px) {
      .main-layout { grid-template-columns: 1.15fr 0.85fr; }
    }

    /* Map Styling */
    #map {
      height: 450px;
      border-radius: 20px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      z-index: 1;
    }

    @media (min-width: 950px) {
      #map { height: 780px; position: sticky; top: 1.5rem; }
    }

    /* Cards Grid & Modern Card Styling */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 600px) and (max-width: 949px) {
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .card {
      background: var(--card-bg);
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .card-img-wrapper {
      position: relative;
      height: 200px;
      overflow: hidden;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .card:hover img { transform: scale(1.05); }

    .badge {
      position: absolute;
      top: 1rem;
      left: 1rem;
      padding: 0.35rem 0.8rem;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 20px;
      text-transform: uppercase;
      background: rgba(15, 23, 42, 0.75);
      color: white;
      backdrop-filter: blur(6px);
      letter-spacing: 0.5px;
    }

    .card-body {
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card h3 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.35rem; color: var(--text-main); }
    .card .meta { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.85rem; font-weight: 500; }
    .card p { font-size: 0.92rem; color: #475569; line-height: 1.5; flex-grow: 1; margin-bottom: 1.25rem; }

    .card-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #f1f5f9;
      padding-top: 0.85rem;
    }

    .btn-more {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-map-pin {
      background: #f1f5f9;
      border: none;
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.8rem;
      color: var(--text-main);
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-map-pin:hover { background: #e2e8f0; }

    /* Modal Overlay & Card Details View */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-content {
      background: white;
      width: 100%;
      max-width: 750px;
      max-height: 90vh;
      border-radius: 24px;
      overflow-y: auto;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      position: relative;
      transform: translateY(20px);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal-content { transform: translateY(0); }

    .modal-close {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      background: rgba(255, 255, 255, 0.85);
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      box-shadow: var(--shadow-md);
      transition: background 0.2s;
    }

    .modal-close:hover { background: white; }

    /* Gallery Carousel inside Modal */
    .gallery-container { position: relative; height: 320px; background: #0f172a; }
    .gallery-container img { width: 100%; height: 100%; object-fit: cover; }
    .gallery-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.8);
      border: none;
      width: 36px; height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
      display: flex; align-items: center; justify-content: center;
    }
    .gallery-nav.prev { left: 1rem; }
    .gallery-nav.next { right: 1rem; }

    .modal-body { padding: 2rem; }
    .modal-body .badge { position: static; display: inline-block; margin-bottom: 0.75rem; }
    .modal-body h2 { font-size: 1.75rem; font-weight: 800; margin-bottom: 0.5rem; }
    .modal-body .meta { font-weight: 600; color: var(--text-muted); margin-bottom: 1.25rem; }
    
    .modal-section { margin-top: 1.5rem; }
    .modal-section h4 { font-size: 1rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--primary); }
    .modal-section p { color: #334155; line-height: 1.6; font-size: 0.95rem; }

    .modal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
      background: #f8fafc;
      padding: 1.25rem;
      border-radius: 14px;
    }

    .modal-grid-item small { color: var(--text-muted); font-size: 0.78rem; text-transform: uppercase; font-weight: 700; }
    .modal-grid-item p { font-weight: 600; color: var(--text-main); font-size: 0.9rem; margin-top: 2px; }

    .modal-footer {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
    }

    .btn-google-maps {
      background: var(--accent);
      color: white;
      text-decoration: none;
      padding: 0.85rem 1.5rem;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .btn-google-maps:hover { background: #b45309; }
  </style>
</head>
<body>

  <header>
    <button class="lang-switcher" id="langToggle">🇧🇷 PT-BR</button>
    <h1 id="headerTitle">Abu Dhabi Family Guide</h1>
    <p id="headerSubtitle">Discover historic landmarks, contemporary architecture, markets & leisure</p>

  <div class="controls-container">
    <input type="text" id="searchInput" class="search-box" placeholder="Search landmarks by name or location..." />
    
    <div class="filter-tags" id="filterTags">
      <button class="tag-btn active" data-category="All" id="tagAll">All</button>
      <button class="tag-btn" data-category="Modern" id="tagModern">Modern</button>
      <button class="tag-btn" data-category="Culture" id="tagCulture">Culture</button>
      <button class="tag-btn" data-category="Heritage" id="tagHeritage">Heritage</button>
      <button class="tag-btn" data-category="Yas Island" id="tagYas">Yas Island</button>
      <button class="tag-btn" data-category="Shopping & Malls" id="tagShopping">Shopping & Malls</button>
      <button class="tag-btn" data-category="Beaches & Leisure" id="tagLeisure">Beaches & Leisure</button>
    </div>
  </div>

  <main class="main-layout">
    <div class="cards-grid" id="cardsGrid"></div>
    <div id="map"></div>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="gallery-container">
        <img id="modalImg" src="" alt="" />
        <button class="gallery-nav prev" onclick="prevImage()">❮</button>
        <button class="gallery-nav next" onclick="nextImage()">❯</button>
      </div>
      <div class="modal-body">
        <span class="badge" id="modalCategory">Category</span>
        <h2 id="modalTitle">Landmark Title</h2>
        <div class="meta" id="modalMeta">Location • Era</div>
        
        <div class="modal-section">
          <h4 id="labelOverview">Overview</h4>
          <p id="modalDescription">Detailed description goes here...</p>
        </div>

        <div class="modal-grid">
          <div class="modal-grid-item">
            <small id="labelHours">Visiting Hours</small>
            <p id="modalHours">09:00 AM - 10:00 PM</p>
          </div>
          <div class="modal-grid-item">
            <small id="labelBestTime">Best Time to Visit</small>
            <p id="modalBestTime">Late Afternoon / Sunset</p>
          </div>
        </div>

        <div class="modal-footer">
          <a id="modalMapLink" href="#" target="_blank" class="btn-google-maps">🗺️ Open in Google Maps</a>
        </div>
      </div>
    </div>
  </div>

      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let markers = [];
    let currentCategory = 'All';
    let searchQuery = '';

    function updateLanguageUI() {
      const langData = translations[currentLang];
      
      document.getElementById('headerTitle').innerText = langData.title;
      document.getElementById('headerSubtitle').innerText = langData.subtitle;
      document.getElementById('searchInput').placeholder = langData.searchPlaceholder;
      document.getElementById('langToggle').innerText = langData.langBtn;

      document.getElementById('labelOverview').innerText = langData.labelOverview;
      document.getElementById('labelHours').innerText = langData.labelHours;
      document.getElementById('labelBestTime').innerText = langData.labelBestTime;

      document.getElementById('tagAll').innerText = langData.categories.All;
      document.getElementById('tagModern').innerText = langData.categories.Modern;
      document.getElementById('tagCulture').innerText = langData.categories.Culture;
      document.getElementById('tagHeritage').innerText = langData.categories.Heritage;
      document.getElementById('tagYas').innerText = langData.categories["Yas Island"];
      document.getElementById('tagShopping').innerText = langData.categories["Shopping & Malls"];
      document.getElementById('tagLeisure').innerText = langData.categories["Beaches & Leisure"];

      filterData();
    }

    function renderCards(filteredData) {
      const cardsGrid = document.getElementById('cardsGrid');
      cardsGrid.innerHTML = '';

      if (filteredData.length === 0) {
        cardsGrid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; padding: 3rem; color: var(--text-muted);">${translations[currentLang].noResults}</p>`;
        return;
      }

      filteredData.forEach(item => {
        const localized = item[currentLang];
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openModal(item);

        card.innerHTML = `
          <div class="card-img-wrapper">
            <img src="${item.images[0]}" alt="${localized.name}" />
            <span class="badge">${translations[currentLang].categories[item.category] || item.category}</span>
          </div>
          <div class="card-body">
            <h3>${localized.name}</h3>
            <div class="meta">${localized.location} • ${localized.era}</div>
            <p>${localized.description.substring(0, 110)}...</p>
            <div class="card-actions">
              <span class="btn-more">${translations[currentLang].readMore}</span>
              <button class="btn-map-pin" onclick="event.stopPropagation(); focusOnMap(${item.coords[0]}, ${item.coords[1]}, '${localized.name.replace(/'/g, "\\'")}')">
                ${translations[currentLang].viewOnMap}
              </button>
            </div>
          </div>
        `;
        cardsGrid.appendChild(card);
      });
    }

    function renderMapMarkers(filteredData) {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      filteredData.forEach(item => {
        const localized = item[currentLang];
        const marker = L.marker(item.coords).addTo(map);
        marker.bindPopup(`
          <div style="max-width:200px">
            <h4 style="margin-bottom:4px;">${localized.name}</h4>
            <small style="color:#666;">${localized.location}</small>
          </div>
        `);
        markers.push(marker);
      });
    }

    function filterData() {
      const filtered = attractions.filter(item => {
        const localized = item[currentLang];
        const matchesCategory = currentCategory === 'All' || item.category === currentCategory;
        const matchesSearch = localized.name.toLowerCase().includes(searchQuery) || 
                              localized.location.toLowerCase().includes(searchQuery);
        return matchesCategory && matchesSearch;
      });

      renderCards(filtered);
      renderMapMarkers(filtered);
    }

    function focusOnMap(lat, lng, name) {
      map.flyTo([lat, lng], 14, { duration: 1.5 });
      markers.forEach(m => {
        const popup = m.getPopup();
        if (popup && popup.getContent().includes(name)) {
          m.openPopup();
        }
      });
      if (window.innerWidth < 950) {
        document.getElementById('map').scrollIntoView({ behavior: 'smooth' });
      }
    }

    /* Modal Component Functions */
    function openModal(item) {
      currentModalItem = item;
      currentImgIndex = 0;
      const localized = item[currentLang];

      document.getElementById('modalImg').src = item.images[0];
      document.getElementById('modalCategory').innerText = translations[currentLang].categories[item.category] || item.category;
      document.getElementById('modalTitle').innerText = localized.name;
      document.getElementById('modalMeta').innerText = `${localized.location} • ${localized.era}`;
      document.getElementById('modalDescription').innerText = localized.description;
      document.getElementById('modalHours').innerText = localized.hours;
      document.getElementById('modalBestTime').innerText = localized.bestTime;
      
      document.getElementById('modalMapLink').href = `https://www.google.com/maps/search/?api=1&query=${item.coords[0]},${item.coords[1]}`;

      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function nextImage() {
      if (!currentModalItem) return;
      currentImgIndex = (currentImgIndex + 1) % currentModalItem.images.length;
      document.getElementById('modalImg').src = currentModalItem.images[currentImgIndex];
    }

    function prevImage() {
      if (!currentModalItem) return;
      currentImgIndex = (currentImgIndex - 1 + currentModalItem.images.length) % currentModalItem.images.length;
      document.getElementById('modalImg').src = currentModalItem.images[currentImgIndex];
    }

    // Toggle Language Event
    document.getElementById('langToggle').addEventListener('click', () => {
      currentLang = currentLang === 'en' ? 'pt' : 'en';
      updateLanguageUI();
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase();
      filterData();
    });

    document.getElementById('filterTags').addEventListener('click', (e) => {
      if (e.target.classList.contains('tag-btn')) {
        document.querySelectorAll('.tag-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        currentCategory = e.target.getAttribute('data-category');
        filterData();
      }
    });

    // Close Modal when clicking outside
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target.id === 'modalOverlay') closeModal();
    });

    // Initial Load
    updateLanguageUI();
  </script>
</body>
</html>
